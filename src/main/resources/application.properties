spring.application.name=sancion
spring.config.import=optional:configserver:http://localhost:8097
server.port=8087


spring.datasource.url=jdbc:mysql://localhost:3306/sancionam_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# URL del MS prestamo. AppConfig abre esta cajita, pregunta por la variable y la inyecta con @Value.
# Si el otro MS necesita cambiar de host/puerto, cambia los numeros.

usuario.url=http://localhost:8089
libro.url=http://localhost:8081


springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

spring.profiles.active=dev